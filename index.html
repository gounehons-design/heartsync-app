<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartSync - Connected Hearts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: rgba(255, 255, 255, 0.95); width: 100%; max-width: 900px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; }
    .header { background: #ff4b72; color: white; padding: 20px; text-align: center; position: relative; }
    .header h1 { font-size: 1.8rem; letter-spacing: 1px; }
    .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; min-height: 450px; }
    @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }
    .video-section { display: flex; flex-direction: column; gap: 10px; background: #111; padding: 15px; border-radius: 16px; position: relative; }
    video { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; background: #222; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 5px; }
    button { background: #ff4b72; color: white; border: none; padding: 10px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e03e61; transform: translateY(-2px); }
    .chat-section { display: flex; flex-direction: column; justify-content: space-between; background: #f8f9fa; border-radius: 16px; padding: 15px; }
    .messages { flex-grow: 1; overflow-y: auto; height: 300px; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .msg.me { background: #ff4b72; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.them { background: #e4e6eb; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-input { display: flex; gap: 10px; margin-top: 15px; }
    .chat-input input { flex-grow: 1; border: 1px solid #ddd; padding: 12px; border-radius: 25px; outline: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>💖 HeartSync 💖</h1>
      <p>Private Calls & Chat</p>
    </div>
    <div class="main-content">
      <div class="video-section">
        <video id="localVideo" autoplay playsinline muted style="height: 240px; border: 2px solid #ff4b72;"></video>
        <div class="controls">
          <button id="startCall">Start Camera</button>
        </div>
      </div>
      <div class="chat-section">
        <div class="messages" id="messageContainer">
          <div class="msg them">Welcome to HeartSync! ❤️</div>
        </div>
        <div class="chat-input">
          <input type="text" id="msgInput" placeholder="Type a message...">
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const localVideo = document.getElementById('localVideo');
    const startCallBtn = document.getElementById('startCall');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const messageContainer = document.getElementById('messageContainer');

    startCallBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = stream;
      } catch (e) {
        alert('Could not access camera/microphone.');
      }
    });

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (text) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg', 'me');
        msgDiv.textContent = text;
        messageContainer.appendChild(msgDiv);
        messageContainer.scrollTop = messageContainer.scrollHeight;
        msgInput.value = '';
      }
    }
  </script>
</body>
</html>
